random_state: 42
models_path: ../coles_models/
prep_datasets_path: ../coles_prep_datasets/
raw_data_path: ../data/
emb_path: ../glove_embeddings/
text_emb_path: ../data/text_embeddings/
report_path: ../coles_experiments/

model:
    embed_size: 48
    seq_encoder_type: gru
    hidden_size: 1024
    neg_pair_selector_cnt: 5

train:
    max_epochs: 150
    device: gpu
    lr: 0.002
    weight_decay: 0.0
    data_loader:
        train:
            min_seq_len: 25
            split_count: 5
            cnt_min: 15
            cnt_max: 75
            batch_size: 128
        val:
            min_seq_len: 1
            split_count: 5
            cnt_min: 25
            cnt_max: 100
            batch_size: 1024
        num_workers: 2
    lr_scheduler:
        enabled: true
        step_size: 10
        gamma: 0.9025
    early_stopping:
        enabled: false
        patience: 10
        min_delta: 0.001
    save_best_checkpoint: false

test:
    recall_top_k:
        enable: true
        calc_on_train: false
        data_loader:
            min_seq_len: 25
            split_count: 5
            cnt_min: 25
            cnt_max: 75
            batch_size: 128
    proxy_metrics:
        enable: true
        calc_on_val: true
        models:
            lgbm_boosting:
                n_estimators: 500
                boosting_type: 'gbdt'
                subsample: 0.5
                subsample_freq: 1
                learning_rate: 0.02
                feature_fraction: 0.75
                max_depth: 6
                lambda_l1: 1
                lambda_l2: 1
                min_data_in_leaf: 50 
                n_jobs: 8
                verbosity: -1
            # random_forest:
            #     basic: true
        metrics:
            - accuracy
            - roc_auc
        n_folds: 5
        batch_size: 32
    num_workers: 0
    device: gpu
    report_name: airi_conf_my_mods_48_last

datasets:
    age_bins:
        target_name: bins
        test_split_coef: 0.2
        val_split_coef: 0.1

    gender:
        target_name: gender
        test_split_coef: 0.1
        val_split_coef: 0.05

