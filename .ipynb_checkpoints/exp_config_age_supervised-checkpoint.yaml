random_state: 42
models_path: ../coles_models/
prep_datasets_path: ../coles_prep_datasets/
raw_data_path: ../data/
emb_path: ../glove_embeddings/
text_emb_path: ../data/text_embeddings/
report_path: ../coles_experiments/
enable_tensorboard: True

model:
    embed_size: 16
    n_heads: 2
    hidden_dim: 128
    n_layers: 2

train:
    max_epochs: 30
    device: gpu
    lr: 0.001
    weight_decay: 0.0
    data_loader:
        train:
            min_seq_len: 25
            max_seq_len: 375
            batch_size: 32
        val:
            min_seq_len: 1
            max_seq_len: 375
            batch_size: 128
        num_workers: 2
    lr_scheduler:
        enabled: true
        step_size: 10
        gamma: 0.9025
    early_stopping:
        enabled: false
        patience: 10
        min_delta: 0.001
    save_best_checkpoint: true

test:
    metrics:
        - accuracy
    batch_size: 128
    num_workers: 0
    device: gpu
    report_name: supervised_embed_sz

datasets:
    age_bins:
        target_name: bins
        test_split_coef: 0.1
        val_split_coef: 0.05

    gender:
        target_name: gender
        test_split_coef: 0.1
        val_split_coef: 0.05

experiments:
    baseline_8:
        trx_encoder_type: basic
        nsep: true
        forse_emb_sz: 8

    baseline_16:
        trx_encoder_type: basic
        nsep: true
        forse_emb_sz: 16

    baseline_24:
