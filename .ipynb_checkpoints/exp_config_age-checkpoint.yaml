random_state: 42
models_path: ../coles_models/
prep_datasets_path: ../coles_prep_datasets/
raw_data_path: ../data/
emb_path: ../glove_embeddings/
report_path: ../coles_experiments/

model:
    embed_size: 16
    seq_encoder_type: gru
    hidden_size: 800

train:
    max_epochs: 150
    device: gpu
    lr: 0.001
    weight_decay: 0.0
    data_loader:
        train:
            min_seq_len: 25
            split_count: 5
            cnt_min: 25
            cnt_max: 200
            batch_size: 64
        val:
            min_seq_len: 1
            split_count: 5
            cnt_min: 25
            cnt_max: 100
            batch_size: 512
        num_workers: 2
    lr_scheduler:
        enabled: true
        step_size: 30
        gamma: 0.9025
    early_stopping:
        enabled: false
        patience: 10
        min_delta: 0.001
    save_best_checkpoint: false

test:
    recall_top_k:
        enable: true
        calc_on_train: false
        data_loader:
            min_seq_len: 25
            split_count: 5
            cnt_min: 25
            cnt_max: 75
            batch_size: 128
    proxy_metrics:
        enable: true
        calc_on_val: true
        models:
            lgbm_boosting:
                n_estimators: 1000
                boosting_type: gbdt
                objective: multiclass
                num_class: 4
                metric: multi_error
                subsample: 0.75
                subsample_freq: 1
                colsample_bytree: null
                learning_rate: 0.02
                feature_fraction: 0.75
                max_depth: 12
                lambda_l1: 1
                lambda_l2: 1
                min_data_in_leaf: 50 
                num_leaves: 50
                random_state: 42
                n_jobs: 8
                verbosity: -1
            # random_forest:
            #     basic: true
        metrics:
            - accuracy
        n_folds: 5
        batch_size: 128
    num_workers: 0
    device: gpu
    report_name: age_airi_conf_all_16

datasets:
    age_bins:
        target_name: bins
        test_split_coef: 0.1
        val_split_coef: 0.05

    gender:
        target_name: gender
        test_split_coef: 0.1
        val_split_coef: 0.05

experiments:
    baseline_with_text_fasttext:
        trx_encoder_type: basic
        nsep: true
        datetime_feats:
            mode: num
            time_embedding: false
        text_feats:
            method: avg_pooling_fasttext
    quant_100_dist_common_emb_fasttext_cat:
        trx_encoder_type: cat
        agg_type : cat 
        disc:
            type: quantile
            k_bins: 100
            fixed_emb: false
        text_feats:
            method: avg_pooling_fasttext
        nemb: false
